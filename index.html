      <div class="home-container1">
        <div class="home-container2">
          <div class="home-container3">
            <style>
              #app-root {
                font-family: "Inter", sans-serif;
                background: var(--bg-dark);

        <section class="gateway-container">
          <div class="gateway-bg">
            <img
              src="https://images.pexels.com/photos/7135050/pexels-photo-7135050.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1500"

            />

          <div class="gateway-content">
            <header class="gateway-header">
              <h1 class="main-title">Hello! How can I help today?</h1>
              <p class="sub-title">Choose how you want to talk with your AI</p>
            </header>
            <main class="gateway-card">
              <div class="mode-selector">
                <button
                  id="btn-tta"
                  aria-pressed="true"
                  class="home-mode-btn active"
                >
                  <div class="icon-wrapper">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="48"
                      height="48"
                      viewBox="0 0 24 24"
                    >
                      <path
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"

                      ></path>
                    </svg>
                  </div>
                  <span>Text to Speech Assaintant</span>
                </button>
                <button
                  id="btn-att"
                  aria-pressed="false"
                  class="home-mode-btn"
                >
                  <div class="icon-wrapper">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="48"
                      height="48"
                      viewBox="0 0 24 24"
                    >
                      <g
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                      >
                        <path d="M12 19v3m7-12v2a7 7 0 0 1-14 0v-2"></path>
                        <rect width="6" height="13" x="9" y="2" rx="3"></rect>
                      </g>
                    </svg>
                  </div>
                  <span>Audio to Text Assaintant</span>
                </button>
              </div>
              <div class="settings-grid">
                <div class="setting-group full-width">
                  <div class="select-wrapper">
                    <label for="voice-select" class="group-label">
                      Choose a Voice
                    </label>
                    <div class="select-wrapper">
                      <select id="voice-select" class="large-select">
                      </select>
                    </div>
                  </div>
                </div>
                <div class="setting-group">
                  <label class="group-label">Speaking Speed</label>
                  <div class="slider-container">
                    <div class="slider-icon">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                      >
                        <g
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                        >

                            d="M12 10l2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a8 8 0 1 0-16 0v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3l2-4zM4.82 7.9L8 10m7.18-2.1L12 10"

                        </g>
                      </svg>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="100"
                      value="50"
                      id="speed"
                      class="large-slider"
                    />
                    <div class="slider-icon">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                      >
                        <g
                          fill="none"
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                        >
                          <path d="M13 16a3 3 0 0 1 2.24 5M18 12h.01"></path>
                          <path
                            d="M18 21h-8a4 4 0 0 1-4-4a7 7 0 0 1 7-7h.2L9.6 6.4a1 1 0 1 1 2.8-2.8L15.8 7h.2c3.3 0 6 2.7 6 6v1a2 2 0 0 1-2 2h-1a3 3 0 0 0-3 3"
                          ></path>
                          <path
                            d="M20 8.54V4a2 2 0 1 0-4 0v3m-8.388 5.524a3 3 0 1 0-1.6 4.3"
                          ></path>
                        </g>
                      </svg>
                    </div>
                  </div>
                </div>
                <div class="setting-group">
                  <label class="group-label">Voice Pitch</label>
                  <div class="slider-container">
                    <span class="pitch-label low">Low</span>
                    <input
                      type="range"
                      min="1"
                      max="100"
                      value="50"
                      id="pitch-slider"
                      class="large-slider"
                    />
                    <span class="pitch-label high">High</span>
                  </div>
                </div>
                <div class="setting-group">
                  <label class="group-label">App Color</label>
                  <div class="color-picker">
                    <button
                      data-color="#4a90e2"
                      class="home-thq-color-dot-elm1 home-color-dot active"
                    ></button>
                    <button
                      data-color="#50c878"
                      class="home-thq-color-dot-elm2 home-color-dot"
                    ></button>
                    <button
                      data-color="#ff7f50"
                      class="home-thq-color-dot-elm3 home-color-dot"
                    ></button>
                    <button
                      data-color="#9b59b6"
                      class="home-thq-color-dot-elm4 home-color-dot"
                    ></button>
                  </div>
                </div>
                <div class="setting-group">
                  <label class="group-label">Personality File</label>
                  <div id="drop-zone" class="upload-box">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="32"
                      height="32"
                      viewBox="0 0 24 24"
                    >
                      <g
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                      >
                        <path
                          d="M12 13v8m-8-6.101A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"
                        ></path>
                        <path d="m8 17l4-4l4 4"></path>
                      </g>
                    </svg>
                    <p>Drop file here</p>
                  </div>
                </div>
              </div>
            </main>
            <footer class="gateway-footer">
              <button class="start-btn">Start Talking Now</button>
            </footer>
          </div>

        <div class="home-container4">
          <div class="home-container5">
            <style>
                      @keyframes fadeIn {from {opacity: 0;
              transform: translateY(20px);}
              to {opacity: 1;
              transform: translateY(0);}}
            </style>
          </div>
        </div>
        <div class="home-container6">
          <div class="home-container7">
            <script defer="" data-name="gateway-section">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  // Mode Toggle Functionality
                  const btnTalk = document.getElementById("btn-talk")
                  const btnListen = document.getElementById("btn-listen")

                  function setActiveMode(activeBtn, inactiveBtn) {
                    activeBtn.classList.add("active")
                    activeBtn.setAttribute("aria-pressed", "true")
                    inactiveBtn.classList.remove("active")
                    inactiveBtn.setAttribute("aria-pressed", "false")
                  }

                  document.getElementById('btn-tta').addEventListener("click", () => setActiveMode(document.getElementById('btn-tta'), document.getElementById('btn-att')))
                  document.getElementById('btn-att').addEventListener("click", () => setActiveMode(document.getElementById('btn-att'), document.getElementById('btn-tta')))

                  // Theme Color Picker Functionality
                  const colorDots = document.querySelectorAll(".color-dot")
                  const startBtn = document.querySelector(".start-btn")

                  colorDots.forEach((dot) => {
                    dot.addEventListener("click", () => {
                      // Remove active class from all dots
                      colorDots.forEach((d) => d.classList.remove("active"))
                      // Add to clicked dot
                      dot.classList.add("active")

                      // Update accent color variable
                      const selectedColor = dot.getAttribute("data-color")
                      document.documentElement.style.setProperty("--accent-color", selectedColor)
                    })
                  })

                  // Drag and Drop Visual Feedback
                  const dropZone = document.getElementById("drop-zone")

                  dropZone.addEventListener("dragover", (e) => {
                    e.preventDefault()
                    dropZone.style.borderColor = "var(--accent-color)"
                    dropZone.style.background = "#f0f7ff"
                  })

                  dropZone.addEventListener("dragleave", () => {
                    dropZone.style.borderColor = "#e1e8ed"
                    dropZone.style.background = "white"
                  })

                  dropZone.addEventListener("drop", (e) => {
                    e.preventDefault()
                    dropZone.style.borderColor = "#50c878"
                    dropZone.querySelector("p").textContent = "File Received!"
                    setTimeout(() => {
                      dropZone.style.borderColor = "#e1e8ed"
                      dropZone.querySelector("p").textContent = "Drop file here"
                    }, 3000)
                  })
                })()
              });
            </script>
          </div>
        </div>
        <a href="https://play.teleporthq.io/signup" class="home-link">
          <div aria-label="Sign up to TeleportHQ" class="home-container8">
            <svg
