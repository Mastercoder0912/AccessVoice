<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100vh;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 15vh;
    }

    #textBar {
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 20px;
      font-size: 24px;
      font-family: Arial, sans-serif;
      border-radius: 5px;
      display: inline-block;
      max-width: 760px;
      word-wrap: break-word;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      position: fixed;
    }

    #textBar:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="textBar"></div>
  <script>
    const textBar = document.getElementById('textBar');
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    textBar.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - textBar.offsetLeft;
      offsetY = e.clientY - textBar.offsetTop;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        textBar.style.left = (e.clientX - offsetX) + 'px';
        textBar.style.top = (e.clientY - offsetY) + 'px';
        textBar.style.bottom = 'auto';
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.electronAPI.on('update-text', (text) => {
      textBar.textContent = text;
      const height = textBar.offsetHeight + 20;
      window.electronAPI.send('resize-textbar', height);
    });
  </script>
</body>
</html>
